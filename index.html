<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>我的個人網站</title>

    <style>
        /* 任務 1：修改整個網頁 */
        body {
            color: #333333;
            background-color: #eaf4ff;
            font-family: Arial, sans-serif;
        }

        /* 任務 2：修改主標題 */
        h1 {
            color: #1a5276;
            font-size: 36px;
            font-weight: bold;
            text-align: center;
            text-shadow: 2px 2px 4px gray;
        }

        /* 任務 3：使用 class */
        .notice {
            color: #ffffff;
            background-color: #3498db;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        /* 任務 4：自由增加 CSS */
        p {
            line-height: 1.8;
        }

        ul {
            list-style-type: square;
        }

    </style>
</head>

<body>

    <h1>我的個人網站</h1>

    <h2>自我介紹</h2>

    <p>
        大家好，歡迎來到我的個人網站！
        這是我使用 HTML 和 CSS 製作的網頁。
    </p>

    <p class="notice">
        這是使用 class 設定的公告區域。
    </p>

    <h2>我的興趣</h2>

    <ul>
        <li>玩電腦</li>
        <li>聽音樂</li>
        <li>看電影</li>
        <li>學習程式設計</li>
    </ul>

    <h2>學習心得</h2>

    <p>
        透過這次 CSS 練習，我學會了如何設定網頁的背景顏色、
        文字顏色、字體大小，以及如何使用 class 修改特定元素的樣式。
    </p>

</body>
</html>
